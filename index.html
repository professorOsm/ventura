<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Premium LLM Engineer portfolio featuring a retro CRT robot, colourful modern interface, and functional AI engineering demonstrations." />
    <meta property="og:title" content="Ventura — LLM Engineer Portfolio" />

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ventura_theme_mode') || 'light';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = theme;
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#536DFE]/20 selection:text-[#536DFE]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
